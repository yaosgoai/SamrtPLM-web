<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartPLM 專案管理系統</title>
  <meta name="description" content="SmartPLM 專案生命週期管理系統">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e293b'/%3E%3Crect x='12' y='16' width='26' height='8' rx='3' fill='%2360a5fa'/%3E%3Crect x='22' y='29' width='30' height='8' rx='3' fill='%2322c55e'/%3E%3Crect x='16' y='42' width='20' height='8' rx='3' fill='%23f59e0b'/%3E%3C/svg%3E">
  <script>
/* 外層站台設定：GAS 網頁應用程式網址（重新部署同一個部署作業 ID 時網址不變，不需修改） */
window.SMARTPLM_CONFIG = {
  appName: 'SmartPLM',
  subtitle: '專案生命週期管理系統',
  gasUrl: 'https://script.google.com/macros/s/AKfycbynk9qoVk_HhcXWBnEQP6-IDKu7KxK3L0jtL6VkzWRNucZt7KAwREVJ7hiKbt0lsSSJ/exec'
};
</script>
  <style>
    :root { --bar: #1e293b; --ink: #1f2933; --muted: #6b7785; --bg: #f5f6f8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; color: var(--ink); }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); z-index: 2; transition: opacity .3s; }
    #splash.gone { opacity: 0; pointer-events: none; }
    .logo { width: 64px; height: 64px; }
    .title { font-size: 24px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 14px; }
    .spin { width: 28px; height: 28px; border: 3px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    .slow { display: none; font-size: 14px; color: var(--muted); text-align: center; max-width: 340px; line-height: 1.6; }
    .slow a { color: #2563eb; }
    #splash.late .slow { display: block; }
    noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 3; }
  </style>
</head>
<body>
  <div id="splash">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1e293b"/><rect x="12" y="16" width="26" height="8" rx="3" fill="#60a5fa"/><rect x="22" y="29" width="30" height="8" rx="3" fill="#22c55e"/><rect x="16" y="42" width="20" height="8" rx="3" fill="#f59e0b"/></svg>
    <div class="title" id="appName">SmartPLM</div>
    <div class="sub" id="subtitle">專案生命週期管理系統</div>
    <div class="spin"></div>
    <div class="slow">系統載入中，Google 伺服器第一次啟動可能需要幾秒鐘。<br>若一直沒有出現登入畫面，請<a id="openNew" href="#" target="_blank" rel="noopener">在新分頁開啟系統</a>。</div>
  </div>
  <iframe id="app" title="SmartPLM 專案管理系統" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <noscript>請啟用 JavaScript 後再開啟本系統。</noscript>
  <script>
    (function () {
      var cfg = window.SMARTPLM_CONFIG || {};
      var url = cfg.gasUrl;
      if (cfg.appName) { document.getElementById('appName').textContent = cfg.appName; document.title = cfg.appName + ' 專案管理系統'; }
      if (cfg.subtitle) document.getElementById('subtitle').textContent = cfg.subtitle;
      var splash = document.getElementById('splash');
      var frame = document.getElementById('app');
      document.getElementById('openNew').href = url;
      if (!url) {
        splash.classList.add('late');
        splash.querySelector('.slow').textContent = '尚未設定系統網址，請在 config.js 填入 gasUrl。';
        splash.querySelector('.spin').remove();
        return;
      }
      var timer = setTimeout(function () { splash.classList.add('late'); }, 8000);
      frame.addEventListener('load', function () {
        clearTimeout(timer);
        splash.classList.add('gone');
      });
      frame.src = url;
    })();
  </script>
</body>
</html>
